name: Check and build add-on

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: "python -m pip install --only-binary=:all: -r requirements-dev.txt"
      - run: python -m ruff check mesh_repair_blender tests scripts
      - run: python -m pytest

  package:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [windows-x64, linux-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/build_release.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-repair-blender-1.0.0-${{ matrix.target }}
          path: dist/*.zip
          retention-days: 30
